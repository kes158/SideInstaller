name: Build unsigned IPA

# Manual only: Actions tab -> "Build unsigned IPA" -> Run workflow.
# Builds the chosen branch (e.g. the one with the Korean files) into an
# unsigned SideInstaller.ipa, the same way scripts/export-ipa.sh does on a Mac,
# and attaches it to the run as a downloadable artifact. Nothing is signed and
# nothing is sent to Apple; sign it afterwards with Feather, SideStore, etc.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build (e.g. add-korean)"
        required: true
        default: main
      bundle_id:
        description: "Bundle ID of the exported app (the Live Activity extension keeps its .LiveActivity suffix)"
        required: true
        default: com.frizzlem.sideinstaller
      version:
        description: "App version to stamp in (leave blank to use the newest heading in CHANGELOG.md)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    # Preview image with Xcode 27 (the app's own toolchain, per NOTES.md).
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      BUNDLE_ID: ${{ inputs.bundle_id }}
      VERSION_INPUT: ${{ inputs.version }}
    steps:
      - name: Check out the chosen ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          # The repo tracks ~1.2 GB of signed IPAs and build folders (output/,
          # output-beta/, build-dd/) that a build never reads. Cone mode also
          # keeps the root files (project.yml, build-rust.sh, CHANGELOG.md).
          sparse-checkout: |
            ios-app
            ios-live-activity
            rust-core

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcode-select -p
          rustc --version
          cargo --version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Add the Rust device target
        # The simulator slice is only for running in Xcode's simulator; an IPA
        # for a real iPhone doesn't need it, and skipping it saves ~3.5 minutes.
        run: rustup target add aarch64-apple-ios

      - name: Restore the Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-core/target
          # Exact key only, on purpose: the next step pins source mtimes so cargo
          # trusts this cache, which is only safe when rust-core is unchanged.
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-core/**', 'build-rust.sh') }}

      - name: Build the Rust library (device only)
        run: |
          set -euo pipefail
          # A fresh checkout stamps every file "now", which makes cargo rebuild
          # the path dependencies in rust-core/vendor even with a warm cache.
          # A fixed old mtime lets it reuse them; the cache key above changes
          # whenever any of these files do, so stale output can't be reused.
          find rust-core -path rust-core/target -prune -o -type f -exec touch -t 200001010000 {} +
          # build-rust.sh without its simulator lines, so any other change the
          # maintainer makes to the script (flags, paths) still applies.
          sed '/aarch64-apple-ios-sim/d' build-rust.sh > build-rust-device.sh
          bash -n build-rust-device.sh
          grep -q 'cargo build --release --target aarch64-apple-ios$' build-rust-device.sh
          chmod +x build-rust-device.sh
          DEVELOPER_DIR="$(xcode-select -p)" ./build-rust-device.sh
          rm -f build-rust-device.sh

      - name: Set the app version
        run: |
          set -euo pipefail
          # project.yml keeps a stale MARKETING_VERSION (0.9.0); the published
          # IPAs get the real version from the maintainer's local Xcode project.
          # Without this the app would report 0.9.0 and show "Update available".
          version="$VERSION_INPUT"
          if [ -z "$version" ]; then
            version="$(grep -m1 -oE '^## [0-9]+(\.[0-9]+)+' CHANGELOG.md | cut -d' ' -f2)"
          fi
          [ -n "$version" ] || { echo "no version found; pass the version input"; exit 1; }
          grep -q 'MARKETING_VERSION:' project.yml
          sed -i '' -E "s/(MARKETING_VERSION: \")[^\"]*(\")/\1${version}\2/" project.yml
          grep -n 'MARKETING_VERSION' project.yml
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Set the bundle id
        run: |
          set -euo pipefail
          # project.yml's ids are com.frizzle.sideinstaller and
          # com.frizzle.sideinstaller.LiveActivity; swapping the shared prefix
          # keeps the extension's id starting with the app's, which iOS needs.
          pbx="SideInstaller.xcodeproj/project.pbxproj"
          grep -q 'com\.frizzle\.sideinstaller' "$pbx"
          sed -i '' "s/com\.frizzle\.sideinstaller/${BUNDLE_ID}/g" "$pbx"
          grep -o 'PRODUCT_BUNDLE_IDENTIFIER = [^;]*;' "$pbx" | sort -u

      - name: Build the app (Release, unsigned)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project SideInstaller.xcodeproj -scheme SideInstaller \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Verify the bundle ids
        run: |
          set -euo pipefail
          app="build/Build/Products/Release-iphoneos/SideInstaller.app"
          test -d "$app"
          got="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          echo "app: $got"
          test "$got" = "$BUNDLE_ID"
          ver="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          echo "version: $ver"
          test "$ver" = "$VERSION"
          for ext in "$app"/PlugIns/*.appex "$app"/Extensions/*.appex; do
            [ -d "$ext" ] || continue
            eid="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$ext/Info.plist")"
            echo "extension: $eid"
            case "$eid" in "$BUNDLE_ID".*) ;; *) echo "extension id outside $BUNDLE_ID"; exit 1 ;; esac
          done

      - name: Package the IPA
        run: |
          set -euo pipefail
          rm -rf stage SideInstaller.ipa
          mkdir -p stage/Payload
          ditto "build/Build/Products/Release-iphoneos/SideInstaller.app" "stage/Payload/SideInstaller.app"
          find stage -name .DS_Store -delete
          (cd stage && zip -qryX ../SideInstaller.ipa Payload)
          ls -lh SideInstaller.ipa

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideInstaller-ipa
          path: SideInstaller.ipa
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
